# Lab (tabular) branch configuration.
# Decisions from the data audit (reports/data_audit_tabular.md, 24 Oct 2026):
# - Bangladesh dataset = main training set (cleaned).
# - India (Mendeley) dataset = pipeline testing only; red flags make it unreliable for training.
# - Both targets mean "heart disease present", not CAD specifically.

seed: 42

data:
  train_sources:
    - bangladesh_cardiac
  pipeline_test_sources:
    - mendeley_india_cvd        # use only to check code runs end to end
  target: heart_disease         # shared-schema name, 1 = present, 0 = absent
  min_age: 18                   # adults only (Bangladesh data includes ages 4-97)

  # Features used to train the main (Bangladesh) model, in shared-schema names.
  features:
    numeric:
      - age
      - bmi
      - bp_mmhg
      - total_cholesterol
      - hdl
      - ldl
      - triglycerides
      - random_blood_sugar
      - hemoglobin
      - creatinine
      - platelets
      - sodium
      - potassium
      - chloride
    categorical:                # binary 0/1
      - sex_male
      - family_history
      - hypertension
      - diabetes
      - chest_pain

  # Only these exist in both datasets with comparable meaning (India <-> Bangladesh tests).
  shared_features: [age, sex_male, bp_mmhg, total_cholesterol, chest_pain]

  # Dropped from the Bangladesh data, with the reason (see audit).
  excluded_columns:
    unit: "leaks the label: every CCU patient is positive"
    troponin_i: "acute-injury marker measured at admission; two incompatible assays; censored values"
    troponin_assay: "only describes troponin_i"
    max_hr: "estimated from age (208 - 0.7 x age), not measured"
    height_cm: "used only to recompute BMI"
    weight_kg: "used only to recompute BMI"

  # Clinically plausible ranges; values outside become missing during cleaning.
  plausible_ranges:
    age: [18, 110]
    bmi: [10, 70]
    bp_mmhg: [60, 260]
    total_cholesterol: [50, 700]
    hdl: [5, 150]
    ldl: [10, 500]
    triglycerides: [20, 2000]
    random_blood_sugar: [1.5, 50]     # mmol/L
    hemoglobin: [3, 25]               # g/dL
    creatinine: [0.1, 20]             # mg/dL
    platelets: [10000, 1500000]       # cells/uL
    sodium: [100, 180]                # mmol/L
    potassium: [1.5, 9]               # mmol/L
    chloride: [60, 150]               # mmol/L
    max_heart_rate: [40, 230]
    oldpeak: [0, 10]

# Evaluation is repeated stratified cross-validation; there is no separate test split
# (too few patients). External validation will use CARRS / South Asia Biobank.
split:
  cv_folds: 5
  cv_repeats: 3

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  xgboost:
    n_estimators: 400
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
  lightgbm:                     # not used yet (build_models doesn't include it)
    n_estimators: 400
    num_leaves: 15
    learning_rate: 0.05
  tabicl:
    enabled: true
    finetune: false
  stack:
    enabled: true
    inner_cv: 3                 # meta-model is logistic regression (tabular/stack.py)

# The model trained on all patients and saved for predict_tabular().
# Calibration is fitted on the cross-validation (held-out) predictions, never on the
# training fit. Override the model from the command line with --final-model.
final:
  model: stack_xgb_tabicl         # see reports/baseline_results_tabular.md; revisit with CARRS
  calibration: platt              # platt suits ~1,000 patients; isotonic needs more data
  # Decision threshold on the calibrated lab probability ("flag as heart disease likely"),
  # chosen on the cross-validation (held-out) predictions. Methods:
  #   youden          - balance sensitivity and specificity (default)
  #   min_sensitivity - highest threshold that still catches >= threshold_target of sick
  #                     patients (screening: fewer missed cases, more false alarms)
  #   fixed           - use threshold_target as the threshold
  # Which trade-off is right is a clinical/team decision; see reports/threshold_tabular.md.
  threshold_method: youden
  threshold_target: null          # e.g. 0.95 for min_sensitivity, 0.5 for fixed
  # predict_tabular() refuses patients with more blank fields than this (out of 19).
  # 97% of training patients had <= 4 missing; mostly-blank inputs are outside what the
  # model has seen and give unreliable scores.
  max_missing_features: 4
  output_path: models/tabular/lab_model.joblib   # gitignored

# SHAP explanations of the final model (src/cad_hybrid/explain/shap_tabular.py).
# Cost per patient is about nsamples x background_size model rows; TabICL is slow on
# CPU, so keep these small. Larger = more precise explanations, slower. At 200 samples
# a single contribution is typically within ~3 percentage points of a long run.
explain:
  background_size: 10     # weighted k-means centres of the training data (not real patients)
  nsamples: 200           # feature combinations evaluated per patient
  report_patients: 50     # patients explained for reports/shap_tabular.md