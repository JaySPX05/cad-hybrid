
# ECG image branch configuration

seed: 42

data:
  train_sources:
    - ecg_multan_pk
  external_test_sources:
    - ecg_bhopal_in

  label_map:
    ecg_multan_pk:
      "Myocardial Infarction": cad_positive
      "History of MI": cad_positive
      "Normal": negative
      "Abnormal Heartbeat": arrhythmia
    ecg_bhopal_in: {}

  classes: [negative, cad_positive, arrhythmia]

  processed_splits:
    train: data/processed/train.csv
    validation: data/processed/validation.csv
    test: data/processed/test.csv

preprocess:
  image_size: 512
  grayscale: false
  crop_to_trace_area: true
  deskew: true
  augment:
    rotation_degrees: 3
    brightness: 0.15
    contrast: 0.15
    blur_prob: 0.2
    horizontal_flip: false
    vertical_flip: false

dedupe:
  hash: phash
  max_hamming_distance: 4

model:
  backbone: efficientnet_b0
  pretrained: imagenet
  stage1:
    epochs: 10
    lr: 1.0e-3
  stage2:
    epochs: 20
    lr: 1.0e-4
    unfreeze_last_n_blocks: 2
  batch_size: 16
  early_stopping_patience: 5

  classifier: CalibratedClassifierCV
  classifier_path: models/ecg_calibrated_classifier.pkl

embed_gbm:
  enabled: true
  head: xgboost

calibration:
  method: platt_sigmoid
  path: models/cad_platt_calibrator.pkl

prediction:
  binary_score: "P(CAD) / (P(CAD) + P(normal))"
  arrhythmia_probability: separate
  threshold: 0.5

class_indices:
  "0": cad_positive
  "1": negative
  "2": arrhythmia

metadata: models/ecg_metadata.json
