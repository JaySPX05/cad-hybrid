
# ECG image branch configuration

seed: 42

data:
  train_sources:
    - ecg_multan_pk
  external_test_sources:
    - ecg_bhopal_in

  label_map:
    ecg_multan_pk:
      "Myocardial Infarction": cad_positive
      "History of MI": cad_positive
      "Normal": negative
      "Abnormal Heartbeat": arrhythmia
    ecg_bhopal_in: {}

  # Numeric class order used by the existing SVM
  classes: [cad_positive, negative, arrhythmia]

  processed_splits:
    train: data/processed/train.csv
    validation: data/processed/validation.csv
    test: data/processed/test.csv

preprocess:
  image_size: 224
  grayscale: false
  crop_to_trace_area: false
  deskew: true
  augment:
    rotation_degrees: 3
    brightness: 0.15
    contrast: 0.15
    blur_prob: 0.2
    horizontal_flip: false
    vertical_flip: false

model:
  backbone: resnet18
  pretrained: imagenet
  classifier: SVC
  classifier_path: models/ecg_svm_classifier.pkl

calibration:
  method: group_aware_oof_multiclass_binary_platt
  path: models/ecg_calibration_bundle.pkl

prediction:
  binary_score: "P(CAD) / (P(CAD) + P(normal))"
  arrhythmia_probability: separate
  threshold: 0.5

class_indices:
  "0": cad_positive
  "1": negative
  "2": arrhythmia

metadata: models/ecg_metadata.json
