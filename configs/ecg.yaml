# ECG (image) branch configuration.

seed: 42

data:
  train_sources:
    - ecg_multan_pk             # Pakistan
  external_test_sources:
    - ecg_bhopal_in             # India: Pakistan -> India cross-country test
  # Map each dataset's original class names to our labels.
  # Confirm against the folder/class names after download.
  label_map:
    ecg_multan_pk:
      "Myocardial Infarction": cad_positive
      "History of MI": cad_positive
      "Normal": negative
      "Abnormal Heartbeat": arrhythmia   # kept separate: arrhythmia is not CAD
    ecg_bhopal_in: {}                    # TODO after download
  classes: [negative, cad_positive, arrhythmia]

preprocess:
  image_size: 512
  grayscale: false
  crop_to_trace_area: true
  deskew: true
  augment:
    rotation_degrees: 3
    brightness: 0.15
    contrast: 0.15
    blur_prob: 0.2
    horizontal_flip: false      # never flip: a mirrored ECG is not a valid ECG
    vertical_flip: false

dedupe:
  hash: phash
  max_hamming_distance: 4       # images closer than this are treated as near-duplicates

model:
  backbone: efficientnet_b0     # timm name; alternative: resnet50
  pretrained: imagenet          # non-medical weights only (data rule)
  stage1:                       # frozen backbone, train new head
    epochs: 10
    lr: 1.0e-3
  stage2:                       # unfreeze upper layers
    epochs: 20
    lr: 1.0e-4
    unfreeze_last_n_blocks: 2
  batch_size: 16
  early_stopping_patience: 5

embed_gbm:
  enabled: true
  head: xgboost                 # or: svm
