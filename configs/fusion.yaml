# Fusion configuration (src/cad_hybrid/fusion/fuse.py).
# Target: CAD. The ECG branch predicts CAD (MI or history of MI vs normal); the lab
# branch predicts heart disease in general, used as a stand-in for CAD because the lab
# data has no CAD label. See the Project doc claude/fusion-integration-plan.md.

# How common CAD is among the people the result is meant for. A product decision
# (screening vs hospital patients). null = use the lab model's training positive rate
# (0.565 for the current model), so a lab-only result equals predict_tabular() and the
# lab decision threshold still applies.
target_prior: null

# Each branch's positive rate: what its probabilities were calibrated on.
# tabular: null = read it from the saved lab model.
# ecg: CAD rate of the ECG calibration (validation) set, one ECG per duplicate group
#      (20 CAD / 44). Counting images instead would give 0.59, because the dataset holds
#      many copies of the same ECG. Regenerate with python -m cad_hybrid.ecg.save_metadata
#      (reports/ecg_metadata.json, fusion_prior) after recalibrating.
branch_priors:
  tabular: null
  ecg: 0.4545

# 1.0 each = naive-Bayes assumption (independent evidence given disease status).
# Can't be learned or checked until there are patients with both labs and an ECG.
branch_weights:
  tabular: 1.0
  ecg: 1.0

# Cut-offs on the fused probability. Placeholders: screening-style values that don't
# fit a hospital-level prior; to be decided together (e.g. based on the lab threshold).
risk_categories:
  low: [0.0, 0.10]
  moderate: [0.10, 0.20]
  high: [0.20, 1.0]
